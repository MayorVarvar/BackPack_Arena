# Настройки плагина. Баланс — в heroes.yml, items.yml, recipes.yml, relics.yml, economy.yml, combat.yml.

# Скорость повтора боя: 1.0 — реальное время симуляции, 2.0 — вдвое быстрее.
# Предмет «Backpack Arena» в хотбаре вне матча: ПКМ — главное меню (играть без команд)
lobby-item: true

# Пошаговое обучение (/ba tutorial, плитка в главном меню)
tutorial:
  offer-on-join: true    # предлагать новичкам при входе
  reward-cards: 3        # награда за первое прохождение матча с подсказками
  # Обучение в меню (после матча): стартовый набор, чтобы попробовать улучшение и кирку,
  # и награда в конце. Карты — обычные, их хватает на первое улучшение обычного предмета.
  menu-kit-cards: 5
  menu-kit-coins: 60
  menu-kit-pickaxes: 10
  menu-reward-gems: 5

# Сохранённые сборки: не больше стольких на игрока (до 27)
builds:
  max: 18

# Сцена матча в мире: 3D-модели героев, удары, урон, частицы — видят все игроки рядом.
# Стоит между точками арены (/ba setarena a|b), а если они не заданы — перед игроком.
battle-stage: true
# Поворот моделей, если они стоят спиной друг к другу (градусы): 0 или 180
stage-yaw-offset: 0

replay-speed: 1.5
# Отсчёт «3, 2, 1» перед каждым боем, секунд (0 — без отсчёта). Идёт ещё в будке, до переноса на поле боя.
battle-countdown: 3
# Ступени скорости боя — множитель к replay-speed. Игрок выбирает: ПКМ по «В бой!» в магазине,
# Shift на поле боя, кнопки в чате или /ba speed. В дуэли бой идёт на меньшей из выбранных скоростей.
battle-speeds: [1.0, 1.5, 1.7, 2.0, 2.5, 2.7, 3.0]
# Пауза перед началом повтора, если отсчёт выключен, тики (20 = 1 с)
battle-start-delay: 30

# Опыт аккаунта на один уровень
xp-per-level: 100

# Точки арены. Ставятся командой /ba setarena a|b. Пусто — игроки остаются на месте.
arena:
  spawn-a: ~
  spawn-b: ~

database:
  file: data.db

# Ресурс-пак с пиксельными иконками из макета. Без пака игроки видят ванильные предметы.
resource-pack:
  enabled: true
  # Внешняя ссылка на BackpackArena-pack.zip (CDN, GitHub Releases). Пусто — плагин раздаёт пак сам.
  url: "https://download.mc-packs.net/pack/836b655de8b6466a8b505e27051a800da2053785.zip"
  # Адрес и порт встроенной раздачи: адрес должен быть доступен игрокам (для локального теста — localhost).
  host: "localhost"
  port: 8173
  # true — без пака на сервер не пустит клиент; false — пак можно отклонить.
  required: false
  send-on-join: true
  prompt: "Иконки предметов и героев Backpack Arena"
