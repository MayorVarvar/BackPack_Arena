# Предметы режима.
# rarity:   COMMON | RARE | EPIC | LEGENDARY | MYTHIC | UNIQUE
# category: WEAPON | ARMOR | POTION | FOOD | PET | MAGIC | MATERIAL | ACCESSORY | BAG
# material: иконка — имя Material из Paper (https://jd.papermc.io/paper/1.21.4/org/bukkit/Material.html)
# shape:    строки из X и точек; для сумок — клетки, которые сумка даёт рюкзаку
# hero:     id героя (только ему) — без поля предмет общий
# in-shop:  false — только крафт
# weapon:   damage: [мин, макс], cooldown (с), stamina, accuracy (0..1), crit, ranged, pet
# effects:  trigger START | TIMER | ON_HIT | ON_CRIT | ON_ATTACKED
#           action  ARMOR THORNS HEAL HASTE EMPOWER LIFESTEAL MANA BLOCK BURN POISON CHILL STUN DAMAGE
#           amount, chance (0..1), mana (стоимость), interval (для TIMER)
